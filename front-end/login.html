<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - gerenciador Financeiro</title>
    <link rel="stylesheet" href="/front-end/style.css">
</head>
<body>
    <div class="container-auth">
        <h2 id="titulo-form">Entrar no Sistema</h2>

        <form id="form-auth">
            <div id="campo-nome" style="display: none;">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Seu nome completo">
            </div>

            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="seu@email.com">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" required placeholder="******">

            <button type="submit" id="btn-submit">Entrar</button>
        </form>

        <p id="msg-erro" style="color: red; margin-top: 10px; "></p>

        <p style="margin-top: 15px;">
            <span id="texto-alternar">Não tem uma conta?</span>
            <a href="#" id="link-alternar">Cadastre-se</a>
        </p>
    </div>
    
    <script src="/front-end/auth.js"></script>
</body>
</html>
