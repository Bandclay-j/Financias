<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planilha Financeira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>  </head>
  <body>
    <div class="container" id="conteudo-relatorio">
      <div class="header">
        <div class="header-title">
          <div class="brand-logo-sm">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path
                d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
              ></path>
            </svg>
          </div>
          <h1>Controle Financeiro</h1>
        </div>
        <button id="btn-logout" class="btn-logout" type="button">Sair</button>
      </div>

      <!-- Filtro por Mês/Ano -->
      <div class="filtro-container">
        <label for="filtro-mes">FILTRAR POR MÊS</label>
        <input type="month" id="filtro-mes" />
      </div>

      <!-- Resumo do Mês -->
      <div class="resumo">
        <div class="card entrada">
          <h3>Entradas</h3>
          <p id="total-entradas">R$ 0,00</p>
        </div>
        <div class="card saida">
          <h3>Saídas</h3>
          <p id="total-saidas">R$ 0,00</p>
        </div>
        <div class="card saldo">
          <h3>Saldo Total</h3>
          <p id="saldo-total">R$ 0,00</p>
        </div>
      </div>

      <!-- Formulário de Cadastro -->
      <form id="form-transacao">
        <div class="form-group">
          <input
            type="text"
            id="descricao"
            placeholder="Descrição (ex: Mercado,Salário)"
            required
          />
        </div>
        <div class="form-row">
          <input
            type="text"
            id="valor"
            placeholder="Valor (R$ 0,00)"
            required
          />
          <input type="date" id="data" required />
        </div>

        <div class="form-row">
          <select id="tipo" required>
            <option value="saida">Saída</option>
            <option value="entrada">Entrada</option>
          </select>

          <select id="categoria" required>
            <option value="Alimentação">Alimentação</option>
            <option value="Moradia">Moradia</option>
            <option value="Transporte">Transporte</option>
            <option value="Lazer">Lazer</option>
            <option value="Saúde">Saúde</option>
            <option value="Salário">Salário</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Adicionar Transação</button>
      </form>

      <!-- Seção do gráfico -->
      <div class="grafico-container">
        <h2>Gastos por Categoria</h2>
        <canvas id="grafico-categorias"></canvas>
      </div>
      
      <div class="historico-header">
        <h2>Histórico do Mês</h2>
        <div class="export-actions">
          <button id="btn-export-csv" class="btn-export" type="button">📊 CSV</button>
          <button id="btn-export-pdf" class="btn-export" type="button">📄 PDF</button>
        </div>
      </div>

      <div id="loading" class="spinner-container" style="display: none;">
        <div class="spinner"></div>
      </div>
      <ul id="lista-transacoes"></ul>
    </div>

    <!-- Modal de Confirmação de Exclusão -->
    <div id="modal-confirm" class="modal-overlay">
      <div class="modal-box">
        <h3>Excluir Transação</h3>
        <p>Tem certeza que deseja remover este item? Esta ação não pode ser desfeita.</p>
        <div class="modal-actions">
          <button id="btn-cancelar-modal" class="btn-secondary">Cancelar</button>
          <button id="btn-confirmar-modal" class="btn-danger">Excluir</button>
        </div>
      </div>
    </div>

    <!-- Modal de Edição -->
     <div id="modal-edit" class="modal-overlay">
      <div class="modal-box">
        <h3>Editar Transação</h3>
        <form id="form-editar-transacao">
          <input type="hidden" id="edit-id" />
          <div class="form-group" style="margin-bottom: 10px;">
            <input type="text" id="edit-descricao" placeholder="Descrição" required />
          </div>
          <div class="form-row" style="margin-bottom: 10px;">
            <input type="text" id="edit-valor" placeholder="Valor" required />
            <input type="date" id="edit-data" required />
          </div>
          <div class="form-row" style="margin-bottom: 16px;">
            <select id="edit-tipo" required>
              <option value="saida">Saída</option>
              <option value="entrada">Entrada</option>
            </select>
            <select id="edit-categoria" required>
              <option value="Alimentação">Alimentação</option>
              <option value="Moradia">Moradia</option>
              <option value="Transporte">Transporte</option>
              <option value="Lazer">Lazer</option>
              <option value="Saúde">Saúde</option>
              <option value="Salário">Salário</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" id="btn-cancelar-edit" class="btn-secondary">Cancelar</button>
            <button type="submit" class="btn-submit" style="padding: 8px 16px;">Salvar</button>
          </div>
        </form>
      </div>
     </div>

    <!-- Container de Toasts (Notificações) -->
    <div id="toast-container"></div>


    <script src="./main.js"></script>
  </body>
</html>
